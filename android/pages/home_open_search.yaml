# Page: Home / bottom nav. Action: open the Search tab and focus the search box.
# Dismisses the "A Faster way to Search" widget promo if it appears.
appId: ${APP_ID}
---
- tapOn:
    id: "org.wikipedia:id/nav_tab_search"
- runFlow:
    when:
      visible: "A Faster way to Search"
    commands:
      - tapOn: "Close"
- tapOn: "Search Wikipedia"
- assertVisible:
    id: "org.wikipedia:id/search_src_text"
