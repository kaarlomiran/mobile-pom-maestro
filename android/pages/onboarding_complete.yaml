# Page: Onboarding. Action: get through the intro carousel to the Explore feed.
# Safe to call when onboarding is not shown (the taps are conditional).
# Waits for the carousel or Home before tapping: on a slow device a fixed number of early checks ran
# before the first page was drawn and left the app on onboarding.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Forward|Skip|Home"
    timeout: 60000
- repeat:
    times: 8                # safety cap; the loop ends as soon as "Forward" is gone
    while:
      visible: "Forward"
    commands:
      - tapOn: "Forward"
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- assertVisible:
    id: "org.wikipedia:id/nav_tab_home"
