# Page: Search. Action: open the first listed article. Ends on the article page.
# Input: RESULT_DESCRIPTION (regex of the result's description line)
appId: ${APP_ID}
---
- tapOn: ${RESULT_DESCRIPTION}
# Recovery: on slow emulators (seen on Android 12) the tap can register as a long-press and open the
# context menu (Open / Open in new tab / Save ...) instead of the article. Choose "Open" in that case.
- runFlow:
    when:
      visible: "Open in new tab"
    commands:
      - tapOn: "Open"
