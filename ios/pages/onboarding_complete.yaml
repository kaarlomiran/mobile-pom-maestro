# Page: Onboarding. Action: walk intro -> data privacy -> languages -> personalization, then Skip, background, relaunch. Ends on Home. (TC01 only.)
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "App Onboarding Intro View"
    timeout: 30000
- tapOn:
    id: "App Onboarding Next Button"
- assertVisible:
    id: "App Onboarding Data Privacy View"
- tapOn:
    id: "App Onboarding Next Button"
- assertVisible:
    id: "App Onboarding Languages View"
- assertVisible: "English"
- tapOn:
    id: "App Onboarding Next Button"
- assertVisible:
    id: "App Onboarding Personalization Intro View"
- tapOn:
    id: "App Onboarding Skip Button"
- waitForAnimationToEnd:
    timeout: 5000
# WORKAROUND (Maestro 2.12.1, iOS 26.5 and 27.2): after the onboarding sheet closes, the SAME driver session keeps
# returning an empty screen (waited 150 s), while a new session or a relaunch sees Home. Backgrounding alone does not
# help. Killing the app right after Skip can lose the "onboarding done" state (run cycle-02, TC04/TC05), so first
# send it to the background (lets it save), then stop and relaunch.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 5000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "Root Tab Home Button"
    timeout: 30000
